include: package:lint/strict.yaml

analyzer:
  exclude:
    - '**.freezed.dart'
    - '**.g.dart'
    - lib/l10n/generated/*.dart
    - test/appium/**
    - coverage/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    todo: warning
    fixme: warning
    hack: info

