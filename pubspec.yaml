name: pile_of_shame
description: An offline list for the game status of all your video games
publish_to: 'none'
version: 1.8.2+810

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: ">=3.50.0 <4.0.0"

dependencies:
  animations: ^3.0.0
  crypto: ^3.0.6
  dynamic_color: ^2.1.0
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^3.0.0
  flutter_sharing_intent: ^2.0.4
  flutter_slidable: ^5.2.0
  flutter_sticky_header: ^0.11.0
  freezed_annotation: ^3.1.0
  fuzzywuzzy: ^1.2.0
  intl: any
  json_annotation: ^4.9.0
  misc_utils:
    path: packages/misc_utils
  nested_scroll_view_plus: ^3.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  riverpod: ^3.0.0
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.3
  theming:
    path: packages/theming
  transparent_image: ^2.0.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.5.4
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: any
  golden_toolkit: ^0.15.0
  json_serializable: any
  lint: ^2.8.0
  mockito: any
  # Testing path_provider requires these dependency
  path_provider_platform_interface: ^2.1.2
  # Testing path_provider requires this dependency
  plugin_platform_interface: any
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/app/
    - assets/misc/
    - assets/platform_families/
    - assets/platforms/controllers/atari/
    - assets/platforms/controllers/microsoft/
    - assets/platforms/controllers/misc/
    - assets/platforms/controllers/nintendo/
    - assets/platforms/controllers/nokia/
    - assets/platforms/controllers/pc/
    - assets/platforms/controllers/retro/
    - assets/platforms/controllers/sega/
    - assets/platforms/controllers/sony/
    - assets/platforms/icons/atari/
    - assets/platforms/icons/microsoft/
    - assets/platforms/icons/misc/
    - assets/platforms/icons/nintendo/
    - assets/platforms/icons/nokia/
    - assets/platforms/icons/pc/
    - assets/platforms/icons/retro/
    - assets/platforms/icons/sega/
    - assets/platforms/icons/sony/

  # Enable image caching and compression
  fonts: []
